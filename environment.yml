name: prismdmet
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy>=1.20
  - scipy
  - pyscf>=2.0
  - opt_einsum   # Prism einsum backend (else Prism falls back to numpy)
  - sympy        # required by Prism (spin-orbit coupling module)
  # Optional: For developers/benchmark execution
  - jupyter
  - matplotlib
  - pytest
  - pip:
      # This installs the PrismDMET package itself in editable mode
      - -e .
